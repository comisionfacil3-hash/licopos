<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Fondo -->
  <rect width="512" height="512" fill="#10b981" rx="80"/>
  
  <!-- Caja de inventario minimalista -->
  <g transform="translate(256, 256)">
    <!-- Base de la caja -->
    <rect x="-90" y="-20" width="180" height="100" fill="white" stroke="white" stroke-width="2" rx="4"/>
    
    <!-- Tapa de la caja (abierta) -->
    <path d="M -90 -20 L -90 -80 L 90 -80 L 90 -20" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Línea divisoria del medio -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="white" stroke-width="6" opacity="0.3"/>
    
    <!-- Detalle de tapa -->
    <circle cx="0" cy="-20" r="6" fill="white"/>
  </g>
</svg>
